<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصور | ميجا للدعاية والإعلان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #17212b; --sky: #b9e8f7; --yellow: #f9c62d; --coral: #f06449; --teal: #0f8b8d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; background: var(--sky); color: var(--ink); font-family: Cairo, sans-serif; }
        a { color: inherit; text-decoration: none; }
        .page { width: min(1180px, calc(100% - 48px)); margin: auto; padding: 25px 0 80px; }
        nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 70px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.1rem; }
        .brand small { font-size: .68rem; }
        .mark { display: grid; place-items: center; width: 43px; height: 43px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 12px 5px; box-shadow: 4px 4px var(--ink); font-family: "Space Grotesk"; }
        .back { padding: 10px 16px; border: 2px solid var(--ink); background: #fff; border-radius: 7px; font-weight: 800; box-shadow: 4px 4px var(--ink); }
        .back:hover { background: #ffc0b5; }
        .heading { display: flex; justify-content: space-between; align-items: end; gap: 25px; margin-bottom: 30px; }
        .heading small { color: var(--coral); font-weight: 900; }
        h1 { margin-top: 8px; font-size: clamp(2.5rem, 6vw, 5.5rem); line-height: 1; }
        .heading p { max-width: 300px; color: #455963; }
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .filter { padding: 10px 14px; border: 2px solid var(--ink); background: #fff; border-radius: 7px; font: inherit; font-weight: 800; cursor: pointer; }
        .filter.active, .filter:hover { background: var(--yellow); }
        .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .photo { min-height: 330px; position: relative; overflow: hidden; border: 2px solid var(--ink); background: var(--ink); box-shadow: 7px 7px var(--ink); }
        .photo img { width: 100%; height: 100%; min-height: 330px; display: block; object-fit: cover; }
        .photo span { position: absolute; right: 15px; bottom: 15px; padding: 6px 10px; background: var(--yellow); border: 2px solid var(--ink); font-weight: 900; }
        @media (max-width: 760px) { .page { width: min(100% - 32px, 580px); } nav, .heading { display: block; } .back { display: inline-block; margin-top: 18px; } .heading p { margin-top: 18px; } .photos { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page">
        <nav>
            <a class="brand" href="index.html"><span class="mark">MA</span><span>ميجا للدعاية والإعلان<br><small>Mega Advertising</small></span></a>
            <a class="back" href="works.html">العودة لسابق أعمالنا ↩</a>
        </nav>
        <header class="heading"><div><small>MEGA ADVERTISING / GALLERY</small><h1 id="title">معرض الصور</h1></div><p>شاهد صور أعمالنا حسب نوع التنفيذ: لافتات مضيئة، بنر، وحروف مضيئة.</p></header>
        <div class="filters" aria-label="أنواع الأعمال">
            <button class="filter" data-type="lighted">💡 اللافتات المضيئة</button>
            <button class="filter" data-type="banner">▣ لافتات البنر</button>
            <button class="filter" data-type="letters">A الحروف المضيئة</button>
        </div>
        <section class="photos" aria-label="صور الأعمال"></section>
    </div>
    <script>
        const works = [
            ["lighted", "WhatsApp Image 2026-09-12 at 6.24.36 PM.jpeg"], ["banner", "WhatsApp Image 2026-09-12 at 6.24.35 PM.jpeg"], ["letters", "WhatsApp Image 2026-09-12 at 6.24.34 PM.jpeg"], ["lighted", "WhatsApp Image 2026-09-12 at 6.24.33 PM.jpeg"], ["letters", "WhatsApp Image 2026-09-12 at 6.24.31 PM.jpeg"], ["banner", "WhatsApp Image 2026-09-12 at 6.24.31 PM (1).jpeg"], ["letters", "WhatsApp Image 2026-09-12 at 6.24.30 PM.jpeg"], ["lighted", "WhatsApp Image 2026-09-12 at 6.24.29 PM.jpeg"], ["banner", "WhatsApp Image 2026-09-12 at 6.24.28 PM.jpeg"], ["letters", "WhatsApp Image 2026-09-12 at 6.24.27 PM.jpeg"], ["lighted", "WhatsApp Image 2026-09-12 at 6.24.26 PM.jpeg"], ["banner", "WhatsApp Image 2026-09-12 at 6.24.25 PM.jpeg"], ["letters", "WhatsApp Image 2026-09-12 at 6.24.20 PM.jpeg"]
        ];
        const labels = { lighted: "لافتة مضيئة", banner: "لافتة بنر", letters: "حروف مضيئة" };
        const photos = document.querySelector(".photos");
        const title = document.querySelector("#title");
        const render = (type) => {
            photos.innerHTML = works.filter(([category]) => category === type).map(([, fileName]) => `<article class="photo"><img src="images/${encodeURIComponent(fileName)}" alt="${labels[type]} من أعمال ميجا"><span>${labels[type]}</span></article>`).join("");
            title.textContent = `معرض ${labels[type]}`;
            document.querySelectorAll(".filter").forEach((button) => button.classList.toggle("active", button.dataset.type === type));
        };
        const type = new URLSearchParams(window.location.search).get("type");
        render(labels[type] ? type : "lighted");
        document.querySelectorAll(".filter").forEach((button) => button.addEventListener("click", () => { window.location.href = `gallery.html?type=${button.dataset.type}`; }));
    </script>
</body>
</html>
